<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin-layout :: head('Manage Orders')}"></head>

<body class="admin-body">

    <!-- Top Navigation -->
    <nav th:replace="~{fragments/admin-layout :: topbar}"></nav>

    <!-- Mobile Sidebar -->
    <div th:replace="~{fragments/admin-layout :: mobileSidebar('orders')}"></div>

    <div class="container-fluid">

        <div class="row">

            <!-- Desktop Sidebar -->
            <aside class="col-lg-2 d-none d-lg-block admin-sidebar py-3">
                <div th:replace="~{fragments/admin-layout :: sidebarLinks('orders')}"></div>
            </aside>

            <!-- Main Content -->
            <main class="col-lg-10 p-4">

                <!-- Success / Error Messages -->
                <div th:replace="~{fragments/admin-layout :: alerts}"></div>

                <!-- Page Heading -->
                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h2 class="fw-bold">
                        <i class="bi bi-receipt"></i>
                        Manage Orders
                    </h2>

                </div>

                <!-- Order Table -->
                <table class="table table-bordered table-hover">

                    <thead class="table-dark">

                        <tr>
                            <th>Order #</th>
                            <th>Customer</th>
                            <th>Items</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Placed On</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="order : ${orders}">

                            <td th:text="${order.orderNumber}"></td>

                            <td th:text="${order.customer.fullName}"></td>

                            <td th:text="${order.orderItems.size()}"></td>

                            <td>&#8377;<span th:text="${#numbers.formatDecimal(order.totalAmount,1,2)}"></span></td>

                            <td>
                                <span th:class="'badge ' + ${
                                    order.status == 'PLACED' ? 'bg-warning text-dark' :
                                    order.status == 'PROCESSING' ? 'bg-info text-dark' :
                                    order.status == 'OUT_FOR_DELIVERY' ? 'bg-primary' :
                                    order.status == 'DELIVERED' ? 'bg-success' :
                                    order.status == 'CANCELLED' ? 'bg-danger' : 'bg-secondary'
                                }" th:text="${order.status}"></span>
                            </td>

                            <td th:text="${#temporals.format(order.createdAt, 'dd-MMM-yyyy HH:mm')}"></td>

                            <td>
                                <a th:href="@{/admin/orders/{id}(id=${order.id})}"
                                   class="btn btn-sm btn-primary">
                                    <i class="bi bi-eye"></i>
                                    View
                                </a>
                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(orders)}">
                            <td colspan="7" class="text-center text-muted">No orders placed yet.</td>
                        </tr>

                    </tbody>

                </table>

            </main>

        </div>

    </div>

    <!-- Bootstrap Scripts -->
    <div th:replace="~{fragments/admin-layout :: scripts}"></div>

</body>

</html>
