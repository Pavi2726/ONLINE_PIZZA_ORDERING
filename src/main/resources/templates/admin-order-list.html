<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin-layout :: head('Manage Orders')}"></head>

<body class="admin-body">

    <!-- Top Navigation -->
    <nav th:replace="~{fragments/admin-layout :: topbar}"></nav>

    <!-- Mobile Sidebar -->
    <div th:replace="~{fragments/admin-layout :: mobileSidebar('orders')}"></div>

    <div class="container-fluid">

        <div class="row">

            <!-- Desktop Sidebar -->
            <aside class="col-lg-2 d-none d-lg-block admin-sidebar py-3">
                <div th:replace="~{fragments/admin-layout :: sidebarLinks('orders')}"></div>
            </aside>

            <!-- Main Content -->
            <main class="col-lg-10 p-4">

                <!-- Success / Error Messages -->
                <div th:replace="~{fragments/admin-layout :: alerts}"></div>

                <!-- Page Heading -->
                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h2 class="fw-bold">
                        <i class="bi bi-receipt"></i>
                        Manage Orders
                    </h2>

                </div>

                <!-- Search / Filter / Sort -->
                <form th:action="@{/admin/orders}" method="get" class="row g-2 align-items-end mb-3 p-3 bg-light rounded">
                    <div class="col-12 col-md-4">
                        <label class="form-label small fw-semibold">Search by order # or customer</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" name="search" class="form-control" th:value="${search}"
                                   placeholder="e.g. ORD-2026 or Jane">
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <label class="form-label small fw-semibold">Status</label>
                        <select name="status" class="form-select">
                            <option value="">All statuses</option>
                            <option th:each="s : ${T(com.pizza.entity.OrderStatus).values()}"
                                    th:value="${s}" th:text="${s}"
                                    th:selected="${s.toString() == selectedStatus}"></option>
                        </select>
                    </div>
                    <div class="col-6 col-md-3">
                        <label class="form-label small fw-semibold">Sort</label>
                        <select name="sort" class="form-select">
                            <option value="">Newest first</option>
                            <option value="oldest" th:selected="${sort == 'oldest'}">Oldest first</option>
                            <option value="totalAsc" th:selected="${sort == 'totalAsc'}">Total (low-high)</option>
                            <option value="totalDesc" th:selected="${sort == 'totalDesc'}">Total (high-low)</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-2 d-grid">
                        <button type="submit" class="btn btn-danger"><i class="bi bi-funnel"></i> Filter</button>
                    </div>
                </form>

                <!-- Order Table -->
                <table class="table table-bordered table-hover">

                    <thead class="table-dark">

                        <tr>
                            <th>Order #</th>
                            <th>Customer</th>
                            <th>Items</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Placed On</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="order : ${orders}">

                            <td th:text="${order.orderNumber}"></td>

                            <td th:text="${order.customer.fullName}"></td>

                            <td th:text="${order.orderItems.size()}"></td>

                            <td>&#8377;<span th:text="${#numbers.formatDecimal(order.totalAmount,1,2)}"></span></td>

                            <td>
                                <span th:class="'badge ' + ${
                                    order.status == 'PLACED' ? 'bg-warning text-dark' :
                                    order.status == 'PROCESSING' ? 'bg-info text-dark' :
                                    order.status == 'OUT_FOR_DELIVERY' ? 'bg-primary' :
                                    order.status == 'DELIVERED' ? 'bg-success' :
                                    order.status == 'CANCELLED' ? 'bg-danger' : 'bg-secondary'
                                }" th:text="${order.status}"></span>
                            </td>

                            <td th:text="${#temporals.format(order.createdAt, 'dd-MMM-yyyy HH:mm')}"></td>

                            <td>
                                <a th:href="@{/admin/orders/{id}(id=${order.id})}"
                                   class="btn btn-sm btn-primary">
                                    <i class="bi bi-eye"></i>
                                    View
                                </a>
                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(orders)}">
                            <td colspan="7" class="text-center text-muted">No orders placed yet.</td>
                        </tr>

                    </tbody>

                </table>

            </main>

        </div>

    </div>

    <!-- Bootstrap Scripts -->
    <div th:replace="~{fragments/admin-layout :: scripts}"></div>

</body>

</html>
