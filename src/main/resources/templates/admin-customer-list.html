<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin-layout :: head('Manage Customers')}"></head>

<body class="admin-body">

    <!-- Top Navigation -->
    <nav th:replace="~{fragments/admin-layout :: topbar}"></nav>

    <!-- Mobile Sidebar -->
    <div th:replace="~{fragments/admin-layout :: mobileSidebar('customers')}"></div>

    <div class="container-fluid">

        <div class="row">

            <!-- Desktop Sidebar -->
            <aside class="col-lg-2 d-none d-lg-block admin-sidebar py-3">
                <div th:replace="~{fragments/admin-layout :: sidebarLinks('customers')}"></div>
            </aside>

            <!-- Main Content -->
            <main class="col-lg-10 p-4">

                <!-- Success / Error Messages -->
                <div th:replace="~{fragments/admin-layout :: alerts}"></div>

                <!-- Page Heading -->
                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h2 class="fw-bold">
                        <i class="bi bi-people"></i>
                        Manage Customers
                    </h2>

                </div>

                <!-- Customer Table -->
                <table class="table table-bordered table-hover">

                    <thead class="table-dark">

                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Address</th>
                            <th>Registered</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="customer : ${customers}">

                            <td th:text="${customer.id}"></td>

                            <td th:text="${customer.fullName}"></td>

                            <td th:text="${customer.email}"></td>

                            <td th:text="${customer.phone}"></td>

                            <td th:text="${customer.address}"></td>

                            <td th:text="${#temporals.format(customer.createdAt, 'dd-MMM-yyyy HH:mm')}"></td>

                            <td>

                                <a th:href="@{/admin/customers/edit/{id}(id=${customer.id})}"
                                   class="btn btn-sm btn-primary me-2">
                                    <i class="bi bi-pencil-square"></i>
                                    Edit
                                </a>

                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(customers)}">
                            <td colspan="7" class="text-center text-muted">No customers registered yet.</td>
                        </tr>

                    </tbody>

                </table>

            </main>

        </div>

    </div>

    <!-- Bootstrap Scripts -->
    <div th:replace="~{fragments/admin-layout :: scripts}"></div>

</body>

</html>
