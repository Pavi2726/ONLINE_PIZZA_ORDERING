# =====================================================================
# Test profile configuration. Backs every test with an in-memory H2
# database (MySQL compatibility mode) so tests never touch the live
# Aiven MySQL instance and never require a .env file to be present.
# =====================================================================

spring.datasource.url=jdbc:h2:mem:pizzatestdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Cloudinary is always @MockBean'd out in AbstractIntegrationTest, but the
# CloudinaryConfig bean still gets constructed during context startup, so
# these must resolve to something (blank is fine, matches @Value defaults).
cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=

# Left blank on purpose: AdminInitializer only seeds an admin when both are
# set, and tests create their own Admin rows via TestDataFactory as needed.
admin.default.email=
admin.default.password=

logging.level.com.pizza=INFO
